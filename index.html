<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MockView is a customizable behavioral interview simulator with live grading and ElevenLabs-voiced feedback."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MockView</title>
    <script>
      // Apply the saved theme before the first paint so light mode doesn't flash dark.
      try {
        var s = JSON.parse(localStorage.getItem('mockview.settings.v1') || '{}')
        var theme = s.theme || 'light' // light is the default
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        if (s.reduceMotion) document.documentElement.dataset.motion = 'reduce'
        if (s.textSize && s.textSize !== 'default') document.documentElement.dataset.text = s.textSize
        if (s.highContrast) document.documentElement.dataset.contrast = 'high'
      } catch (e) {}
    </script>
    <style>
      /* Opening animation. Inline so it paints before the app's JS and CSS load. */
      #boot { --b: #f6f8fa; --t: #1f2328; --a: #0969da; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--t); }
      html[data-theme='dark'] #boot { --b: #07090d; --t: #e6edf3; --a: #58a6ff; }
      @media (prefers-color-scheme: dark) { html:not([data-theme]) #boot { --b: #07090d; --t: #e6edf3; --a: #58a6ff; } }
      #boot.calm, #boot.calm * { animation: none !important; }
      #boot.calm .intro-count, #boot.calm .intro-tag { display: none; }
      #boot.calm { animation: calm-out 0.3s ease 0.6s forwards !important; }
      @keyframes calm-out { to { opacity: 0; visibility: hidden; } }
      #boot.skip { animation: intro-out 0.35s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
      /* Loading counter in the corner, rolls 0 to 100 */
      @property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
      #boot .intro-count {
        position: absolute; top: 28px; left: 36px;
        font-size: clamp(64px, 11vw, 150px); font-weight: 400; letter-spacing: -0.04em; line-height: 1;
        font-variant-numeric: tabular-nums; opacity: 0.9;
        animation: count 1.15s cubic-bezier(0.3, 0, 0.2, 1) both;
        counter-reset: n var(--n);
      }
      #boot .intro-count::after { content: counter(n); }
      #boot .intro-tag {
        position: absolute; left: 36px; bottom: 32px; font-size: 15px; line-height: 1.35; opacity: 0.75;
        animation: word-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
      }
      @keyframes count { from { --n: 0; } to { --n: 100; } }
      @media (max-width: 520px) { #boot .intro-count { top: 20px; left: 20px; } #boot .intro-tag { left: 20px; bottom: 24px; } }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--b);
        cursor: pointer;
        animation: intro-out 0.5s cubic-bezier(0.6, 0, 0.4, 1) 1.25s forwards;
      }
      #boot .intro-mark {
        display: flex;
        align-items: center;
        gap: 18px;
        animation: intro-mark 1.25s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #boot .intro-bars {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 72px;
      }
      #boot .intro-bars i {
        width: 10px;
        height: calc(72px * var(--h));
        border-radius: 5px;
        background: var(--t);
        transform-origin: center;
        animation:
          bar-in 0.55s cubic-bezier(0.3, 1.4, 0.5, 1) var(--d) both,
          bar-pulse 0.7s ease-in-out calc(var(--d) + 0.55s) 2 alternate;
      }
      #boot .intro-bars i.accent {
        background: var(--a);
      }
      #boot .intro-word {
        overflow: hidden;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      #boot .intro-word span {
        display: block;
        animation: word-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s both;
      }
      #boot .intro-word b {
        color: var(--a);
      }
      @keyframes bar-in {
        from {
          transform: scaleY(0);
          opacity: 0;
        }
      }
      @keyframes bar-pulse {
        to {
          transform: scaleY(0.55);
        }
      }
      @keyframes word-in {
        from {
          transform: translateY(110%);
        }
      }
      @keyframes intro-mark {
        from {
          transform: scale(0.94);
        }
      }
      @keyframes intro-out {
        to {
          clip-path: inset(0 0 100% 0);
          visibility: hidden;
        }
      }
      #boot { clip-path: inset(0 0 0 0); }
      #boot .intro-mark { animation: intro-mark 1.25s cubic-bezier(0.2, 0.8, 0.2, 1) both, mark-out 0.5s cubic-bezier(0.7, 0, 0.3, 1) 1.2s forwards; }
      @keyframes mark-out { to { transform: translateY(-40px) scale(1.06); opacity: 0; } }
      @media (max-width: 520px) {
        #boot .intro-word {
          font-size: 32px;
        }
        #boot .intro-bars {
          height: 52px;
        }
        #boot .intro-bars i {
          height: calc(52px * var(--h));
          width: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="intro-count"></div>
      <div class="intro-tag">Practice the interview<br />before it counts.</div>
      <div class="intro-mark">
        <div class="intro-bars">
          <i style="--h: 0.34; --d: 0ms"></i><i style="--h: 0.62; --d: 70ms"></i><i class="accent" style="--h: 1; --d: 140ms"></i><i style="--h: 0.7; --d: 210ms"></i><i style="--h: 0.3; --d: 280ms"></i>
        </div>
        <div class="intro-word"><span>Mock<b>View</b></span></div>
      </div>
    </div>
    <script>
      // Reduced motion gets a still logo that fades out; the sample report link skips it.
      try {
        var boot = document.getElementById('boot')
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'reduce'
        if (location.hash === '#sample') boot.remove()
        else if (reduce) boot.className = 'calm'
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
